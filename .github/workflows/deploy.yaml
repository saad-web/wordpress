name: Deploy to Kubernetes via ArgoCD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate YAML syntax
        run: |
          echo "Validating YAML files..."
          for file in manifests/*.yaml; do
            echo "Checking $file..."
            python3 -c "import yaml; yaml.safe_load(open('$file'))" || exit 1
          done
          echo "All manifests are valid YAML!"

      - name: List manifests
        run: |
          echo "=== Kubernetes Manifests ==="
          ls -la manifests/
          echo ""
          echo "=== Resources to deploy ==="
          for file in manifests/*.yaml; do
            echo "- $file"
          done

  deploy:
    name: Deploy to Cluster
    runs-on: self-hosted
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync ArgoCD Application
        run: |
          echo "=== Syncing ArgoCD Application ==="
          export KUBECONFIG=/home/saad/kubernetes/config

          # Force ArgoCD to refresh and sync
          kubectl patch application wordpress -n argocd --type merge \
            -p '{"metadata":{"annotations":{"argocd.argoproj.io/refresh":"hard"}}}' || true

          sleep 10

          # Apply manifests directly to ensure immediate update
          kubectl apply -f manifests/

          echo "=== Deployment triggered ==="

      - name: Rollout Restart
        run: |
          export KUBECONFIG=/home/saad/kubernetes/config
          echo "Restarting deployments..."
          kubectl rollout restart deployment/wordpress -n wordpress || true
          kubectl rollout restart deployment/mysql -n wordpress || true

          echo "Waiting for rollout..."
          kubectl rollout status deployment/wordpress -n wordpress --timeout=120s || true
          kubectl rollout status deployment/mysql -n wordpress --timeout=120s || true

      - name: Show Status
        run: |
          export KUBECONFIG=/home/saad/kubernetes/config
          echo "=== Pod Status ==="
          kubectl get pods -n wordpress
          echo ""
          echo "=== Events ==="
          kubectl get events -n wordpress --sort-by='.lastTimestamp' | tail -10
