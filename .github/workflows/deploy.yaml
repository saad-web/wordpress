name: Deploy to Kubernetes via ArgoCD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate YAML syntax
        run: |
          echo "Validating YAML files..."
          for file in manifests/*.yaml; do
            echo "Checking $file..."
            python3 -c "import yaml; yaml.safe_load(open('$file'))" || exit 1
          done
          echo "All manifests are valid YAML!"

      - name: List manifests
        run: |
          echo "=== Kubernetes Manifests ==="
          ls -la manifests/
          echo ""
          echo "=== Resources to deploy ==="
          for file in manifests/*.yaml; do
            echo "- $file"
          done

  notify:
    name: Deployment Info
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    steps:
      - name: ArgoCD Sync Info
        run: |
          echo "=== Deployment Status ==="
          echo "Branch: main"
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "ArgoCD will automatically sync these changes."
          echo "Monitor deployment in ArgoCD UI."
